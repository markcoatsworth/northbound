<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Northbound</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="game-root">
      <canvas id="game-canvas"></canvas>
      <div id="hud">
        <div id="fps"></div>
      </div>
      <div id="controls">
        <div id="dpad">
          <button class="dpad-btn dpad-up" data-action="up" aria-label="Up">▲</button>
          <button class="dpad-btn dpad-left" data-action="left" aria-label="Left">◀</button>
          <button class="dpad-btn dpad-right" data-action="right" aria-label="Right">▶</button>
          <button class="dpad-btn dpad-down" data-action="down" aria-label="Down">▼</button>
        </div>
        <div id="action-buttons">
          <button class="action-btn action-c" data-action="c" aria-label="C">C</button>
          <button class="action-btn action-x" data-action="x" aria-label="X">X</button>
          <button class="action-btn action-z" data-action="z" aria-label="Z">Z</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
