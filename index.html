<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Northbound</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="game-root">
      <div id="stage">
        <div id="screen">
          <canvas id="game-canvas"></canvas>
          <div id="hud">
            <div id="fps"></div>
          </div>
        </div>
        <div
          id="controls"
          title="Keyboard: Arrows / WASD to move · Up / Space to jump · Z X C to fire"
        >
          <div id="action-buttons">
            <button class="action-btn" data-action="z" aria-label="Z">Z</button>
            <button class="action-btn" data-action="x" aria-label="X">X</button>
            <button class="action-btn" data-action="c" aria-label="C">C</button>
          </div>
          <div id="arrow-buttons">
            <button class="arrow-btn" data-action="up" aria-label="Up">▲</button>
            <button class="arrow-btn" data-action="down" aria-label="Down">▼</button>
            <button class="arrow-btn" data-action="left" aria-label="Left">◀</button>
            <button class="arrow-btn" data-action="right" aria-label="Right">▶</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
